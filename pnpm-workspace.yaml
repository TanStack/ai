cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'kiira@0.6.0' # root dev dependency (TS7-native engine); freshly published
  - 'kiira-core@0.6.0' # transitive dependency of kiira@0.6.0
  # Working closely with the aimock team; the e2e suite often needs fresh
  # releases of this test-only mock as it tracks provider SDK changes.
  - '@copilotkit/aimock'
  # Build-time devDep; 0.6.0 is the release carrying the dts-5/Vite-8 fix
  # (TanStack/config#403) this toolchain migration depends on.
  - '@tanstack/vite-config@0.6.0'
  # @tanstack/ai-octane's framework peer + its testing library. Octane
  # publishes these two in lockstep — @octanejs/testing-library pins an exact
  # `octane` peer — so they must be excluded together or neither resolves.
  # Octane releases roughly daily, so the newest pair is essentially always
  # inside the 24h window.
  - 'octane@0.1.17'
  - '@octanejs/testing-library@0.1.14'

trustPolicyExclude:
  - 'chokidar@4.0.3' # existing transitive from sass/nitro; latest v4 with v5 available
  - 'semver@5.7.2' # existing Babel/jscodeshift transitive; latest v5, released years ago
  - 'semver@6.3.1' # existing Babel transitive; latest v6, released years ago
  - 'undici-types@6.21.0' # existing @types/node transitive via happy-dom/vitest, types-only

# pnpm v11 dropped support for these fields in package.json — they must live
# here. See https://github.com/pnpm/pnpm/releases/tag/v11.0.0.
overrides:
  abbrev: ^3.0.0
  # Force every workspace library under packages/ to resolve to its local
  # workspace copy, even when a transitive/example dependency references a
  # published version. When you add a new package under packages/, add it here.
  '@tanstack/ai': workspace:*
  '@tanstack/ai-anthropic': workspace:*
  '@tanstack/ai-cli': workspace:*
  '@tanstack/ai-client': workspace:*
  '@tanstack/ai-code-mode': workspace:*
  '@tanstack/ai-code-mode-models-eval': workspace:*
  '@tanstack/ai-code-mode-skills': workspace:*
  '@tanstack/ai-devtools-core': workspace:*
  '@tanstack/ai-elevenlabs': workspace:*
  '@tanstack/ai-event-client': workspace:*
  '@tanstack/ai-fal': workspace:*
  '@tanstack/ai-gemini': workspace:*
  '@tanstack/ai-grok': workspace:*
  '@tanstack/ai-groq': workspace:*
  '@tanstack/ai-isolate-cloudflare': workspace:*
  '@tanstack/ai-isolate-node': workspace:*
  '@tanstack/ai-isolate-quickjs': workspace:*
  '@tanstack/ai-mcp': workspace:*
  '@tanstack/ai-ollama': workspace:*
  '@tanstack/ai-openai': workspace:*
  '@tanstack/ai-openrouter': workspace:*
  '@tanstack/ai-preact': workspace:*
  '@tanstack/ai-react': workspace:*
  '@tanstack/ai-react-ui': workspace:*
  '@tanstack/ai-solid': workspace:*
  '@tanstack/ai-solid-ui': workspace:*
  '@tanstack/ai-svelte': workspace:*
  '@tanstack/ai-utils': workspace:*
  '@tanstack/ai-vue': workspace:*
  '@tanstack/ai-vue-ui': workspace:*
  '@tanstack/openai-base': workspace:*
  '@tanstack/preact-ai-devtools': workspace:*
  '@tanstack/react-ai-devtools': workspace:*
  '@tanstack/solid-ai-devtools': workspace:*

# TypeScript 7's `typescript` package no longer ships the JS Compiler API
# (`ts.sys`, `ts.createProgram`, etc.). These framework tools embed that API,
# have no TS7 fallback, and don't declare `typescript` themselves — so they
# resolve the root-hoisted TS7 and crash. Inject the API-complete 6.0.2 shim
# into their own node_modules so they resolve it before walking up to root.
packageExtensions:
  '@sveltejs/package':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  svelte-check:
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  vue-tsc:
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  # knip drives the TS JS API, which TS7 dropped. Inject the 6.0.2 shim into
  # its node_modules so it resolves it instead of the root-hoisted TS7. knip's
  # peer range already caps at `<7`. (kiira 0.6.0 type-checks with the project's
  # native TS7 compiler directly, so it no longer needs the shim.)
  knip:
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  # typedoc (pnpm generate-docs, via @tanstack/typedoc-config) imports the
  # TypeScript JS Compiler API at module load (`ts.SyntaxKind`). TS7 dropped
  # that API. typedoc 0.28.x supports TS 5–6 only (TS7 support is unreleased,
  # TypeStrong/typedoc#3098). Inject the 6.0.2 shim into both packages so
  # typedoc's typescript peer resolves the shim from its parent instead of
  # walking up to the root-hoisted TS7.
  typedoc:
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  '@tanstack/typedoc-config':
    dependencies:
      typescript: 'npm:@typescript/typescript6@6.0.2'
  # @analogjs/vite-plugin-angular (ai-angular's vitest transform) declares no
  # typescript, so it grabs the root-hoisted TS7 and calls JS-API functions
  # (ts.createIncrementalCompilerHost) that TS7 dropped. Angular also can't run
  # on TS7 at all, so pin it to 5.9.3 (ai-angular's own version, Angular-
  # supported) rather than the 6.0.2 shim.
  '@analogjs/vite-plugin-angular':
    dependencies:
      typescript: 5.9.3

# Keep @types/bun out of pnpm's shared virtual store (node_modules/.pnpm/node_modules).
# @types/bun (a devDep of @tanstack/ai-isolate-quickjs-bun) globally augments Node/DOM
# types — notably it redeclares `fetch` with `init: RequestInit | BunFetchRequestInit`,
# dropping the DOM `preconnect` member. When it's hoisted into the shared store, the
# phantom `import "bun"` type statements inside unrelated deps (srvx, crossws in the
# nitro/SSR stack) resolve to it, leaking that augmentation into example apps' `tsc`
# runs and breaking their `typeof fetch` usage. Excluding it from the shared store
# keeps it resolvable only by its direct dependent (which links it in its own
# node_modules), so the Bun types stay scoped to the package that needs them.
hoistPattern:
  - '*'
  - '!@types/bun'

patchedDependencies:
  '@changesets/assemble-release-plan@6.0.9': patches/@changesets__assemble-release-plan@6.0.9.patch

packages:
  - 'packages/*'
  - 'packages/ai-code-mode/models-eval'
  - 'examples/*'
  - 'testing/*'
  - 'codemods'

allowBuilds:
  # Vite + every transitive bundler-step needs the platform-specific binary.
  esbuild: true
  # @google/genai (used by @tanstack/ai-gemini in CI) loads files generated by
  # protobufjs's postinstall. Its own `preinstall` is a no-op echo and
  # `prepare` only runs when developing the SDK from a git checkout, so it
  # has no runtime effect on consumers.
  protobufjs: true
  # Expo/Metro reaches this through msgpackr and can use the native extractor.
  msgpackr-extract: true
  # Everything below is reachable only from dev scripts (wrangler dev,
  # examples/ts-code-mode-web), is a perf optimisation with a working JS
  # fallback, or has a no-op postinstall — none are required for `pnpm test:ci`
  # to pass. Flip to true case-by-case if a future change relies on the script.
  '@openrouter/sdk': false
  '@parcel/watcher': false
  isolated-vm: false
  nx: false
  puppeteer: false
  sharp: false
  unrs-resolver: false
  workerd: false
  '@google/genai': false
  lmdb: true
  # dockerode (@tanstack/ai-sandbox-docker) pulls these only for SSH-based
  # Docker connections; the local-socket path the provider uses has a working
  # JS fallback, so their native builds are not required.
  cpu-features: false
  ssh2: false
  # Prisma and better-sqlite3 are peer-resolution artifacts only — no workspace
  # package depends on them, so nothing imports the generated client or the
  # native addon and their build scripts have nothing to produce for us.
  '@prisma/client': false
  '@prisma/engines': false
  prisma: false
  better-sqlite3: false
