name: Coverage

# Measures coverage for every package on main. The numbers themselves are not
# asserted here — the point is to populate the Nx Cloud cache, so that when a
# PR re-measures its merge-base the `test:coverage` task hashes already exist
# remotely and the summaries are restored instead of recomputed.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read

jobs:
  coverage:
    name: Warm Coverage Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@7bbdf583c2fc1a7f596283cd01e0e44c43f574f2 # main
      - name: Run Coverage
        # Keep the args after `--` identical to both runs in pr.yml. Nx puts
        # forwarded args in the task hash, so any difference is a cache miss.
        run: pnpm exec nx run-many --targets=test:coverage --exclude='examples/**,testing/**' -- --coverage.reporter=json-summary --coverage.include='src/**'
