name: AI review

# In-process Grok review bot, split into two jobs.
#
# Auto review runs on cron, not on `pull_request`: a fork's `pull_request`
# event gets no repo secrets, so the job could never start on the PRs that
# most need it. The scheduled sweep picks up open PRs instead.
#
# THE SPLIT IS THE SECURITY BOUNDARY.
#
#   review   runs the agent over untrusted PR code. It gets XAI_API_KEY and
#            the read-only GITHUB_TOKEN. It gets NO PAT, so the agent — which
#            runs with tool approval disabled — has no repo credential to
#            steal. It performs no GitHub writes; it emits a results file.
#   publish  holds AI_REVIEW_TOKEN and performs every write. It never runs
#            the agent and never installs or executes PR code.
#
# publish treats the results file as hostile: it re-derives which PRs were
# eligible and re-runs the malware scan from the API, so a compromised review
# job cannot fake a clean scan or choose where a push lands.
#
# No human gates a run, so the malware scan does. A scan pass is earned per
# head SHA and cannot be carried over or granted by hand.
#
# Never pull_request_target. Never pnpm install in the PR tree.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
  issue_comment:
    types: [created]

concurrency:
  group: >-
    ai-review-${{ github.event_name == 'schedule' && 'sweep'
    || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions: {}

env:
  AI_REVIEW_RESULTS: ai-review-results.json

jobs:
  review:
    name: Review
    if: >
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only, and deliberately no AI_REVIEW_TOKEN anywhere in this job.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f # main
      - name: Build packages
        run: pnpm exec nx run @tanstack/ai-grok-build:build
      - name: Add PR head worktree
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_ISSUE: ${{ github.event.issue.number }}
          PR_NUMBER_DISPATCH: ${{ github.event.inputs.pr_number }}
        shell: bash
        run: |
          case "${EVENT_NAME}" in
            issue_comment)
              PR_NUMBER="${PR_NUMBER_ISSUE}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${PR_NUMBER_DISPATCH}"
              ;;
            *)
              echo "unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "invalid PR number"
            exit 1
          fi
          git fetch origin "pull/${PR_NUMBER}/head:ai-review-pr-head"
          git worktree add "${GITHUB_WORKSPACE}/.pr-head" ai-review-pr-head
          SHA="$(git -C "${GITHUB_WORKSPACE}/.pr-head" rev-parse HEAD)"
          LOGIN="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.author.login // empty' || true)"
          echo "AI_REVIEW_HEAD_COMMIT_AUTHOR=${LOGIN}" >> "${GITHUB_ENV}"
      - name: Run review
        if: github.event_name != 'schedule'
        run: pnpm ai-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_REVIEW_WORKTREE: ${{ github.workspace }}/.pr-head
      - name: Run sweep
        if: github.event_name == 'schedule'
        run: pnpm ai-review:sweep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-results
          path: ${{ env.AI_REVIEW_RESULTS }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: review
    # Runs even when review failed partway: PRs the scan blocked still need
    # their rejection comment, and that is written here.
    if: always() && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f # main
      - name: Download results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-results
        continue-on-error: true
      - name: Publish
        env:
          AI_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
        shell: bash
        run: |
          if [ -z "${AI_REVIEW_TOKEN}" ]; then
            echo "missing AI_REVIEW_TOKEN"
            exit 1
          fi
          pnpm ai-review:publish
