name: Before main CI timing simulation

# Temporary benchmark of pre-migration main checks. No release steps.
on:
  pull_request:

concurrency:
  group: before-main-ci-timing-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  checks:
    name: Before main package checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_CI_EXECUTION_ENV: before-main-checks
      NX_CI_CACHE_BUST: before-main-cold-20261009-01-checks
    steps:
      - name: Checkout before migration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 96191eafee12040c78f849fe7d47220f64591684
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f
      - name: Bust task hashes
        run: |
          node --input-type=module <<'BENCHMARK'
          // Temporary benchmark: new task hashes retain agent-to-agent artifact transfer.
          import { execFileSync } from 'node:child_process'
          import { readFileSync, rmSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { tmpdir } from 'node:os'

          if (!process.env.NX_CI_CACHE_BUST) throw new Error('Missing cache-bust nonce')
          const graphFile = join(tmpdir(), `ai-cache-bust-${process.pid}.json`)
          execFileSync('pnpm', ['exec', 'nx', 'graph', `--file=${graphFile}`], {
            stdio: 'inherit',
          })
          const { graph } = JSON.parse(readFileSync(graphFile, 'utf8'))
          rmSync(graphFile)
          for (const { data } of Object.values(graph.nodes)) {
            const file = join(data.root, 'package.json')
            const pkg = JSON.parse(readFileSync(file, 'utf8'))
            pkg.nx ??= {}
            pkg.nx.targets ??= {}
            for (const [name, target] of Object.entries(data.targets ?? {})) {
              pkg.nx.targets[name] = {
                ...pkg.nx.targets[name],
                inputs: [
                  ...(target.inputs ?? ['default', '^default']),
                  { env: 'NX_CI_CACHE_BUST' },
                ],
              }
            }
            writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          }
          console.log(`Cache-bust applied to ${Object.keys(graph.nodes).length} projects`)
          BENCHMARK
      - name: Run main checks
        run: pnpm run test:ci

  coverage:
    name: Before main coverage cache warming
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_CI_EXECUTION_ENV: before-main-coverage
      NX_CI_CACHE_BUST: before-main-cold-20261009-01-coverage
    steps:
      - name: Checkout before migration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 96191eafee12040c78f849fe7d47220f64591684
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f
      - name: Bust task hashes
        run: |
          node --input-type=module <<'BENCHMARK'
          // Temporary benchmark: new task hashes retain agent-to-agent artifact transfer.
          import { execFileSync } from 'node:child_process'
          import { readFileSync, rmSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { tmpdir } from 'node:os'

          if (!process.env.NX_CI_CACHE_BUST) throw new Error('Missing cache-bust nonce')
          const graphFile = join(tmpdir(), `ai-cache-bust-${process.pid}.json`)
          execFileSync('pnpm', ['exec', 'nx', 'graph', `--file=${graphFile}`], {
            stdio: 'inherit',
          })
          const { graph } = JSON.parse(readFileSync(graphFile, 'utf8'))
          rmSync(graphFile)
          for (const { data } of Object.values(graph.nodes)) {
            const file = join(data.root, 'package.json')
            const pkg = JSON.parse(readFileSync(file, 'utf8'))
            pkg.nx ??= {}
            pkg.nx.targets ??= {}
            for (const [name, target] of Object.entries(data.targets ?? {})) {
              pkg.nx.targets[name] = {
                ...pkg.nx.targets[name],
                inputs: [
                  ...(target.inputs ?? ['default', '^default']),
                  { env: 'NX_CI_CACHE_BUST' },
                ],
              }
            }
            writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          }
          console.log(`Cache-bust applied to ${Object.keys(graph.nodes).length} projects`)
          BENCHMARK
      - name: Run main coverage
        run: pnpm exec nx run-many --targets=test:coverage --exclude='examples/**,testing/**' -- --coverage.reporter=json-summary --coverage.include='src/**'

  e2e:
    name: Before E2E Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every shard finish, so one run shows all failing tests.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NX_CI_EXECUTION_ENV: before-main-e2e-${{ matrix.shard }}
      # Independent salts prevent cache sharing between the original shards.
      NX_CI_CACHE_BUST: before-main-cold-20261009-01-e2e-${{ matrix.shard }}
    steps:
      - name: Checkout before migration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 96191eafee12040c78f849fe7d47220f64591684
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f
      - name: Bust task hashes
        run: |
          node --input-type=module <<'BENCHMARK'
          // Temporary benchmark: new task hashes retain agent-to-agent artifact transfer.
          import { execFileSync } from 'node:child_process'
          import { readFileSync, rmSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { tmpdir } from 'node:os'

          if (!process.env.NX_CI_CACHE_BUST) throw new Error('Missing cache-bust nonce')
          const graphFile = join(tmpdir(), `ai-cache-bust-${process.pid}.json`)
          execFileSync('pnpm', ['exec', 'nx', 'graph', `--file=${graphFile}`], {
            stdio: 'inherit',
          })
          const { graph } = JSON.parse(readFileSync(graphFile, 'utf8'))
          rmSync(graphFile)
          for (const { data } of Object.values(graph.nodes)) {
            const file = join(data.root, 'package.json')
            const pkg = JSON.parse(readFileSync(file, 'utf8'))
            pkg.nx ??= {}
            pkg.nx.targets ??= {}
            for (const [name, target] of Object.entries(data.targets ?? {})) {
              pkg.nx.targets[name] = {
                ...pkg.nx.targets[name],
                inputs: [
                  ...(target.inputs ?? ['default', '^default']),
                  { env: 'NX_CI_CACHE_BUST' },
                ],
              }
            }
            writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          }
          console.log(`Cache-bust applied to ${Object.keys(graph.nodes).length} projects`)
          BENCHMARK

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('testing/e2e/package.json') }}
          restore-keys: |
            playwright-

      - name: Build Packages
        run: pnpm run build:all

      # GitHub-hosted ubuntu-24.04 already has Chromium system libs.
      # install-deps / --with-deps run apt-get against azure.archive.ubuntu.com
      # and that mirror hangs, which kills this job.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @tanstack/ai-e2e exec playwright install chromium

      - name: Run E2E Tests
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @tanstack/ai-e2e test:e2e --shard="$SHARD/4"

      - name: Upload Video Recordings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-videos-${{ matrix.shard }}
          path: testing/e2e/test-results/**/*.webm
          retention-days: 14

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: testing/e2e/playwright-report/
          retention-days: 14

      - name: Upload Traces (on failure)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: testing/e2e/test-results/**/*.zip
          retention-days: 14

  # Branch rules require a check named "E2E Tests". The shards above have
  # other names, so this job reports their combined result under that name.
  e2e-result:
    name: Before E2E Tests
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success
