name: PR

on:
  pull_request:
  push:
    branches: [main, alpha, beta, rc]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CLOUD_CONTINUOUS_ASSIGNMENT: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_CI_EXECUTION_ENV: agents
      VITEST_MAX_WORKERS: 1
      # Temporary full task-cache benchmark; remove after the trial.
      NX_CI_CACHE_BUST: full-cold-20261009-02
      # PRs run all checks; branch pushes retain the E2E trigger while Release
      # runs its existing package checks. Both use one distributed task graph.
      TARGETS: ${{ github.event_name == 'pull_request' && 'test:sherif,test:knip,test:docs,test:kiira,test:maintainer,test:ai-review,test:oxlint,test:lib:ci,test:types,test:build,build,test:react-native,test:dts,test:e2e:ci--merge-reports,test:coverage:ci,build:preview' || 'test:e2e:ci--merge-reports' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get base and head commits for `nx affected`
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
        with:
          main-branch-name: main
      - name: Start Nx Agents
        id: agents
        run: >-
          npx --yes nx-cloud@19.1.3 start-ci-run
          --distribute-on=".nx/workflows/dynamic-changesets.yaml"
          --with-env-vars=VITEST_MAX_WORKERS
          --require-explicit-completion
          --stop-agents-after="$TARGETS"
          --stop-agents-on-failure=false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f # main
      - name: Bust all task hashes
        run: node scripts/ci-cache-bust.mjs
      - name: Run Checks
        run: pnpm exec nx run-many --targets="$TARGETS"
      - name: Upload Video Recordings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-videos
          path: testing/e2e/test-results/**/*.webm
          retention-days: 14
      - name: Upload Playwright Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-report
          path: testing/e2e/playwright-report/
          retention-days: 14
      - name: Upload Traces (on failure)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-traces
          path: testing/e2e/test-results/**/*.zip
          retention-days: 14
      - name: Upload Coverage Result
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-result
          path: .nx/pr-artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Preview Builds
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-builds
          path: .nx/pr-artifacts/preview-builds.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Complete Nx CI run
        if: ${{ always() && steps.agents.outcome == 'success' }}
        run: npx --yes nx-cloud@19.1.3 complete-ci-run
  e2e-result:
    name: E2E Tests
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check distributed results
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
  coverage:
    name: Coverage
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # only the report step reads the token
    steps:
      - name: Download Coverage Result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-result
          path: ${{ runner.temp }}/coverage
      - name: Check Coverage Result
        run: |
          report="$RUNNER_TEMP/coverage/report.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/coverage/result.json", "utf8")); if (result.status !== 0) process.exit(1)'
      # One comment per PR, updated on each push. Runs when Compare fails too.
      # A fork's token cannot write comments, so fork PRs skip this step; the
      # table is in the job summary either way.
      - name: Post the coverage report
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          report="$RUNNER_TEMP/coverage/report.md"
          [ -f "$report" ] || exit 0
          ids=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id')
          read -r id <<< "$ids" || true
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$report" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$report" > /dev/null
          fi
  preview:
    name: Preview
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # pnpm pack resolves workspace dependencies, but publication needs no
      # example dependencies or install scripts (including E2E browsers).
      - name: Install publication dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter './packages/*'
      - name: Download Preview Builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-builds
          path: ${{ runner.temp }}/preview
      - name: Restore Package Builds
        run: tar -xzf "$RUNNER_TEMP/preview/preview-builds.tar.gz"
      - name: Publish Previews
        run: pnpx pkg-pr-new publish --pnpm './packages/*'
