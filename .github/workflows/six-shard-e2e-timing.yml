name: Six-shard E2E timing simulation

# Temporary E2E-only benchmark; same agent count as the per-file trial.
on:
  pull_request:

concurrency:
  group: six-shard-e2e-timing-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_CI_CACHE_BUST: six-shard-isolated-perf-cold-20261009-03

jobs:
  e2e:
    name: Six-shard E2E on Nx Agents
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NX_CI_EXECUTION_ENV: six-shard-e2e
      NX_CLOUD_CONTINUOUS_ASSIGNMENT: true
      VITEST_MAX_WORKERS: 1
      TARGETS: test:e2e:ci--merge-reports
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start Nx Agents
        id: agents
        run: >-
          npx --yes nx-cloud@19.1.3 start-ci-run
          --distribute-on="18 linux-medium-ai"
          --with-env-vars=VITEST_MAX_WORKERS
          --require-explicit-completion
          --stop-agents-after="$TARGETS"
          --stop-agents-on-failure=false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f
      - name: Bust task hashes
        run: node scripts/ci-cache-bust.mjs
      - name: Run main E2E
        run: pnpm exec nx run-many --targets="$TARGETS"
      - name: Upload Playwright Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: six-shard-timing-e2e-report
          path: testing/e2e/playwright-report/
          retention-days: 14
      - name: Complete Nx CI run
        if: ${{ always() && steps.agents.outcome == 'success' }}
        run: npx --yes nx-cloud@19.1.3 complete-ci-run
