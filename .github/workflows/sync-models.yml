name: Sync Model Metadata

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true # sync job pushes generated model updates

      - name: Setup Tools
        uses: TanStack/config/.github/setup@0b5996988cf0938ae77119e0164f9738a453d7c8 # main

      - name: Fetch and sync model metadata
        run: pnpm generate:models

      - name: Check for package changes
        id: changes
        run: |
          if git diff --quiet -- packages/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and force-push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ scripts/openrouter.models.json scripts/openrouter.video-models.json scripts/vercel-gateway.models.json scripts/.sync-models-last-run .changeset/
          git commit -m "chore: sync model metadata"
          # GITHUB_TOKEN pushes do not start the PR Test / E2E workflows.
          # After this job, a maintainer must run those checks from the
          # Actions tab or push an empty commit to automated/sync-models.
          git push --force origin HEAD:automated/sync-models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="automated/sync-models"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -z "$EXISTING_PR" ] || [ "$EXISTING_PR" = "null" ]; then
            BODY=$(cat <<'PRBODY'
          Automated daily sync of model metadata from OpenRouter and Vercel AI Gateway.

          - Fetches the latest model list from OpenRouter (chat + `GET /api/v1/videos/models`)
          - Fetches the latest model list from Vercel AI Gateway
          - Converts to the internal adapter format
          - Syncs provider-specific model metadata for affected packages
          - Creates a patch changeset for all changed packages
          PRBODY
          )
            gh pr create \
              --title "chore: sync model metadata" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi
