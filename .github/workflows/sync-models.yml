name: Sync Model Metadata

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write # failure alert issue

jobs:
  sync:
    name: Sync Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true # sync job pushes generated model updates

      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f # main

      # Each sync runs as its own step so one provider failing does not block
      # the others. Whatever succeeded is still committed, then the job fails.
      - name: Fetch gateway models
        id: fetch
        continue-on-error: true
        run: pnpm generate:models:fetch

      - name: Convert gateway models
        id: convert
        continue-on-error: true
        run: pnpm regenerate:models

      - name: Sync ElevenLabs models
        id: elevenlabs
        continue-on-error: true
        run: pnpm generate:models:elevenlabs

      - name: Sync provider models
        id: provider
        continue-on-error: true
        run: pnpm exec tsx scripts/sync-provider-models.ts

      - name: Format
        run: pnpm format

      - name: Check for package changes
        id: changes
        run: |
          if git diff --quiet -- packages/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and force-push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ scripts/openrouter.models.json scripts/openrouter.video-models.json scripts/vercel-gateway.models.json scripts/lovable-gateway.models.json scripts/.sync-models-last-run .changeset/
          git commit -m "chore: sync model metadata"
          # GITHUB_TOKEN pushes do not start the PR Test / E2E workflows.
          # After this job, a maintainer must run those checks from the
          # Actions tab or push an empty commit to automated/sync-models.
          git push --force origin HEAD:automated/sync-models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BRANCH="automated/sync-models"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -z "$EXISTING_PR" ] || [ "$EXISTING_PR" = "null" ]; then
            BODY=$(cat <<'PRBODY'
          Automated daily sync of model metadata from OpenRouter, Vercel AI Gateway, Lovable AI Gateway, and modelschemas (ElevenLabs text-to-speech, music, sound effects, and voice design).

          - Fetches the latest model list from OpenRouter (chat + `GET /api/v1/videos/models`)
          - Fetches the latest model list from Vercel AI Gateway
          - Fetches the latest model list from Lovable AI Gateway
          - Converts to the internal adapter format
          - Syncs provider-specific model metadata for affected packages
          - Inserts new ElevenLabs text-to-speech, music, sound-effect, and voice-design models from modelschemas
          - Creates a patch changeset for all changed packages
          PRBODY
          )
            gh pr create \
              --title "chore: sync model metadata" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi

      - name: Fail if any sync step failed
        if: >-
          steps.fetch.outcome == 'failure' ||
          steps.convert.outcome == 'failure' ||
          steps.elevenlabs.outcome == 'failure' ||
          steps.provider.outcome == 'failure'
        run: |
          echo "::error::A model sync step failed. Passing steps were still committed."
          exit 1

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: >-
            fetch=${{ steps.fetch.outcome }},
            convert=${{ steps.convert.outcome }},
            elevenlabs=${{ steps.elevenlabs.outcome }},
            provider=${{ steps.provider.outcome }}
        shell: bash
        run: |
          gh label create sync-models --color B60205 --description "Daily model sync failures" --force
          BODY=$(printf '%s\n' \
            "🚨 Sync Model Metadata failed on $(date -u +%F)." \
            "" \
            "Run: $RUN_URL" \
            "Step outcomes: $OUTCOMES" \
            "" \
            "Steps that passed were still committed to \`automated/sync-models\`. Close this issue when the sync is green again.")
          ISSUE=$(gh issue list --label sync-models --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --label sync-models \
              --title "🚨🚨🚨 DAILY MODEL SYNC IS FAILING 🚨🚨🚨 Model updates are NOT landing" \
              --body "$BODY"
          fi
