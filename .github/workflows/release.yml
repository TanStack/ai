name: Release

on:
  push:
    branches: [main, alpha, beta, rc]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.repository_owner == 'TanStack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      - name: Run Tests
        run: vp run test:ci

  release:
    name: Release
    needs: test
    if: github.repository_owner == 'TanStack'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      - name: Build packages
        # Fresh, cache-bypassing build so dist/ is on disk when changeset
        # publish packs tarballs. A cached build can report success without
        # materializing dist/, shipping src-only packages (see 0.33.0-0.36.0).
        run: vpx nx run-many --targets=build --exclude=examples/**,testing/** --skip-nx-cache
      - name: Run Changesets (version or publish)
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: vp run changeset:version
          publish: vp run changeset:publish
          commit: "ci: Version Packages"
          title: "ci: Version Packages"
      - name: Generate Docs
        if: steps.changesets.outputs.published == 'true'
        run: vp run generate-docs
      - name: Commit Generated Docs
        if: steps.changesets.outputs.published == 'true'
        run: |
          if [[ ! -f docs/reference/index.md ]]; then
            echo "generate-docs produced no reference pages; refusing to commit" >&2
            exit 1
          fi
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            BRANCH_NAME="docs/auto-update-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "docs: regenerate API documentation"
            git push origin "$BRANCH_NAME"
            gh pr create --title "docs: regenerate API documentation" --body "Automated documentation update from release" --base main --head "$BRANCH_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Comment on PRs about release
        if: steps.changesets.outputs.published == 'true'
        uses: TanStack/config/.github/comment-on-release@190f659075ff0845850e330883eb26d7ffd0671f # main
        with:
          published-packages: ${{ steps.changesets.outputs.publishedPackages }}
