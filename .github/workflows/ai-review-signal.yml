name: AI review signal

# Unprivileged tripwire. Runs on opened, synchronize, and ready_for_review for
# PRs that target main, with no secrets and no checkout, then exits. GitHub can
# hold it for approval for a first-time contributor. Its completion fires the
# privileged AI review workflow (workflow_run), which runs on main with secrets.
# The review job is skipped unless this run concludes `success`.
# Never add secrets, checkouts, or install steps here.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ai-review-signal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  signal:
    name: Signal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Signal
        shell: bash
        run: echo "AI review signal for PR ${{ github.event.pull_request.number }}"
